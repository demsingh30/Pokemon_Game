
<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="main.css">
<head>
  <meta charset="utf-8">
  <title>Who's That Pokémon?</title>
  <style>
    .hidden-pokemon { filter: brightness(0); }
  </style>
</head>
<body>
  <h1>Who's That Pokémon?</h1>
  <h2>Points: <span id="points">0</span></h2>

  <button id="reset-btn" type="button">Reset</button>

  <img id="pokemon-img" class="hidden-pokemon" src="" alt="Mystery Pokémon">

  <input id="guess" type="text" placeholder="Type your guess">
  <button id="guess-btn" type="button">Guess</button>

  <p id="result"></p>

  <script src="main.js"></script>
</body>
</html>
